name: CharterMediaPlayer
options:
  bundleIdPrefix: network.supers
  deploymentTarget:
    iOS: '16.0'
targets:
  CharterMediaPlayer:
    type: application
    platform: iOS
    sources:
      - CharterMediaPlayer
      - components/CharterGAPI/src/charter_gapi_core.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.supers.charter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Charter Media Player
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: '5.10'
        SWIFT_OBJC_BRIDGING_HEADER: CharterMediaPlayer/CharterGapiBridge.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/components/CharterGAPI/include
        TARGETED_DEVICE_FAMILY: '1,2'
