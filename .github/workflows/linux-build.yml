name: Linux build
on:
  push:
    branches: [linux]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 development files
        timeout-minutes: 7
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: Compile Charter
        run: make
