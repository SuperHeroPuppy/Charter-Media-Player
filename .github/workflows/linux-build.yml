name: Linux build
on:
  push:
    branches: [linux]
  workflow_dispatch:
concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 development files
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: Compile Charter
        run: make
